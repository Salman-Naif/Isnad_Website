# Continuous integration: every push to main and every pull request is linted, scanned for
# security issues, tested at every level, and built into the Docker image Railway will run.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Code security scan (bandit)
        run: bandit -q -c pyproject.toml -r app
      - name: Dependency vulnerabilities (pip-audit)
        run: pip-audit -r requirements-dev.txt --progress-spinner off

  tests:
    name: Tests (unit → system)
    runs-on: ubuntu-latest
    env:
      # The end-to-end tests run the database service from its own repository, next to this one.
      ISNAD_DB_REPO: ${{ github.workspace }}/../isnad-database
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4  # Newman runs the Postman collection in the system tests
        with:
          node-version: "22"
      - run: pip install -r requirements-dev.txt
      - name: Check out the database service
        # A private repository needs a read-only token in the ISNAD_DB_TOKEN secret; without it
        # this step is skipped and so are the end-to-end tests.
        id: database
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: Salman-Naif/Isnad_Database
          path: isnad-database
          token: ${{ secrets.ISNAD_DB_TOKEN || github.token }}
      - name: Database service environment
        if: steps.database.outcome == 'success'
        run: |
          mv isnad-database ..
          python -m venv ../isnad-database/.venv
          ../isnad-database/.venv/bin/pip install -r ../isnad-database/requirements.txt
      - name: Unit tests
        run: pytest -m unit --cov --cov-report= --cov-fail-under=0
      - name: Integration tests
        run: pytest -m integration --cov --cov-append --cov-report= --cov-fail-under=0
      - name: API tests
        run: pytest -m api --cov --cov-append --cov-report= --cov-fail-under=0
      - name: Security tests
        run: pytest -m security --cov --cov-append --cov-report= --cov-fail-under=0
      - name: System tests (website + database service, end to end)
        run: pytest -m system
      - name: Coverage (at least 90%)
        run: coverage report

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [quality, tests]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t isnad-website .
      - name: Start and check /health
        run: |
          docker run -d --name isnad -p 8000:8000 isnad-website
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs isnad
          exit 1
